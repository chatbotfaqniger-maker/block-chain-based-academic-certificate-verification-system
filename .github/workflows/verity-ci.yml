name: VERITY build and test

on:
  pull_request:
    branches: [main, feature/institutional-bulk-student-management]
  push:
    branches: [main, feature/verity-cinematic-showcase-guides]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check server syntax
        run: node --check server/index.js && node --check server/staff-permissions.js && node --check server/student-import-worker.js
      - name: Build frontend
        run: npm run build
      - name: Run automated tests
        run: npm test
      - name: Build production Docker image
        run: docker build -t verity-ci .

  queue-migration-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: verity
          POSTGRES_PASSWORD: verity-ci-only
          POSTGRES_DB: verity_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verity -d verity_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap isolated Supabase-compatible schema
        env:
          PGPASSWORD: verity-ci-only
        run: psql -h localhost -U verity -d verity_ci -v ON_ERROR_STOP=1 -f tests/fixtures/queue-migration-bootstrap.sql
      - name: Execute durable issuance queue migration
        env:
          PGPASSWORD: verity-ci-only
        run: psql -h localhost -U verity -d verity_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261122140000_durable_bulk_certificate_issuance_queue.sql
      - name: Verify queue claim, completion and expired-lease safety
        env:
          PGPASSWORD: verity-ci-only
        run: psql -h localhost -U verity -d verity_ci -v ON_ERROR_STOP=1 -f tests/fixtures/queue-migration-lifecycle.sql
