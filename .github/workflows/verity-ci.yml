name: VERITY build and test

on:
  pull_request:
    branches: [main, feature/verity-durable-bulk-certificate-issuance]
  push:
    branches: [main, feature/verity-cinematic-showcase-guides, feature/verity-durable-bulk-certificate-issuance, feature/verity-ledger-security-hardening]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check server syntax
        run: node --check server/index.js && node --check server/staff-permissions.js && node --check server/student-import-worker.js && node --check server/bulk-certificate-worker.js && node --check server/bulk-certificate-service.js
      - name: Build frontend
        run: npm run build
      - name: Run automated tests
        run: npm test
      - name: Build production Docker image
        run: docker build -t verity-ci .

  rpc-execution-privileges:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: verity
          POSTGRES_PASSWORD: verity-ci-only
          POSTGRES_DB: verity_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verity -d verity_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap Supabase roles and RPC fixtures
        env:
          PGPASSWORD: verity-ci-only
        run: psql -h localhost -U verity -d verity_ci -v ON_ERROR_STOP=1 -f tests/fixtures/rpc-privilege-bootstrap.sql
      - name: Apply RPC execution hardening migration
        env:
          PGPASSWORD: verity-ci-only
        run: psql -h localhost -U verity -d verity_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261123221423_restrict_sensitive_rpc_execution.sql
      - name: Assert public and authenticated execution boundaries
        env:
          PGPASSWORD: verity-ci-only
        run: psql -h localhost -U verity -d verity_ci -v ON_ERROR_STOP=1 -f tests/fixtures/rpc-privilege-assertions.sql

  student-roster-import-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: verity
          POSTGRES_PASSWORD: verity-ci-only
          POSTGRES_DB: verity_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verity -d verity_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap the existing VERITY roster schema
        env:
          PGPASSWORD: verity-ci-only
        run: psql -h localhost -U verity -d verity_ci -v ON_ERROR_STOP=1 -f tests/fixtures/roster-import-bootstrap.sql
      - name: Apply durable roster import migration
        env:
          PGPASSWORD: verity-ci-only
        run: psql -h localhost -U verity -d verity_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261123223013_add_durable_roster_import_queue.sql
      - name: Verify ICT permissions, idempotency and queue accounting
        env:
          PGPASSWORD: verity-ci-only
        run: psql -h localhost -U verity -d verity_ci -v ON_ERROR_STOP=1 -f tests/fixtures/roster-import-assertions.sql

  bulk-certificate-issuance-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: verity
          POSTGRES_PASSWORD: verity-ci-only
          POSTGRES_DB: verity_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verity -d verity_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap certificate schema fixture
        env:
          PGPASSWORD: verity-ci-only
        run: psql -h localhost -U verity -d verity_ci -v ON_ERROR_STOP=1 -f tests/fixtures/bulk-certificate-issuance-bootstrap.sql
      - name: Apply durable bulk issuance migration
        env:
          PGPASSWORD: verity-ci-only
        run: psql -h localhost -U verity -d verity_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261124071328_durable_bulk_certificate_issuance_queue.sql
      - name: Verify retries, leases, reconciliation and privileges
        env:
          PGPASSWORD: verity-ci-only
        run: psql -h localhost -U verity -d verity_ci -v ON_ERROR_STOP=1 -f tests/fixtures/bulk-certificate-issuance-assertions.sql

  certificate-ledger-security-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: verity_security_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d verity_security_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap production-shaped certificate schema and permissive grants
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d verity_security_test -v ON_ERROR_STOP=1 -f tests/fixtures/certificate-ledger-hardening-bootstrap.sql
      - name: Confirm checkout contains the latest anchor validation
        run: |
          grep -q 'NEW."chainId" > 0' supabase/migrations/20261124074628_certificate_ledger_integrity_hardening.sql
          ! grep -q 'length(NEW."chainId")' supabase/migrations/20261124074628_certificate_ledger_integrity_hardening.sql
          ! grep -q 'translate(NEW."chainId"' supabase/migrations/20261124074628_certificate_ledger_integrity_hardening.sql
          git rev-parse HEAD
          sha256sum supabase/migrations/20261124074628_certificate_ledger_integrity_hardening.sql
      - name: Apply certificate ledger hardening migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d verity_security_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261124074628_certificate_ledger_integrity_hardening.sql
      - name: Assert immutability, record-aware verification and least-privilege grants
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d verity_security_test -v ON_ERROR_STOP=1 -f tests/fixtures/certificate-ledger-hardening-assertions.sql
