name: VERITY build and test

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/verity-cinematic-showcase-guides]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Run automated tests
        run: npm test
      - name: Build production Docker image
        run: docker build -t verity-ci .
