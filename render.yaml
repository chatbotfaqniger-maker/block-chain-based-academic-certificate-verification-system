databases:
  - name: verity-postgres
    databaseName: verity
    user: verity
    plan: free
    region: oregon

services:
  - type: web
    name: verity-academic-credentials
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: verity-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_NAME
        value: Registry Administrator
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_INSTITUTION
        value: Demo University
      - key: PUBLIC_APP_URL
        sync: false
